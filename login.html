<!-- login.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login DPM</title>
  <style>
    :root {
      --verde-dpm: #0f5d3d;
      --azul-dpm: #003366;
      --blanco: #ffffff;
      --amarillo: #ffe600;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: url('jugadores/EstadioChinquihue.png') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: var(--azul-dpm);
    }

    

    .login-container {
      background: rgba(255, 255, 255, 0.95);
      border: 2px solid var(--verde-dpm);
      border-radius: 12px;
      padding: 2rem;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
    }

    .login-container h2 {
      color: var(--verde-dpm);
    }

    .login-container input {
      width: 100%;
      padding: 0.7rem;
      margin: 0.5rem 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    .btn {
      background-color: var(--verde-dpm);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
      margin-top: 1rem;
    }

    .btn:hover {
      background-color: #0c4b32;
    }

    nav {
      background: linear-gradient(90deg, var(--verde-dpm), var(--azul-dpm));
      width: 100%;
      padding: 1rem 0;
      position: fixed;
      bottom: 0;
      text-align: center;
    }

    nav a {
      color: var(--blanco);
      margin: 0 1rem;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      color: var(--amarillo);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>Club Deportes Puerto Montt</h2>
    <form id="loginForm">
      <input type="text" placeholder="Usuario" required />
      <input type="password" placeholder="Contraseña" required />
      <button type="submit" class="btn">Entrar</button>
    </form>
  </div>

  <nav>
    <a href="login.html">Login</a>
    <a href="jugadores.html">Jugadores</a>
    <a href="posiciones.html">Tabla</a>
    <a href="novedades.html">Novedades</a>
    <a href="historia.html">Historia</a>
    <a href="tienda.html" class="active">Tienda</a>
    <a href="carrito.html">Carrito 🛒</a>
  </nav>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function (event) {
      event.preventDefault();
      const usuario = document.querySelector('input[type="text"]').value;
      const pass = document.querySelector('input[type="password"]').value;

      if (usuario && pass) {
        localStorage.setItem("logueado", "true");
        window.location.href = "jugadores.html"; // Redirige tras login
      } else {
        alert("Completa ambos campos para ingresar.");
      }
    });
  </script>
</body>
</html>
