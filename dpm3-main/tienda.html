<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tienda Oficial DPM</title>
  <style>
    :root {
      --verde-dpm: #0f5d3d;
      --azul-dpm: #003366;
      --blanco: #ffffff;
      --amarillo: #ffe600;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background-color: var(--blanco);
      background-image: url('jugadores/logo-deportes-puertomontt.png');
      background-repeat: repeat;
      background-size: 100px;
      padding: 0 1rem 90px;
      color: var(--azul-dpm);
    }

    h1 {
      text-align: center;
      background: linear-gradient(90deg, var(--azul-dpm), var(--verde-dpm));
      color: var(--blanco);
      padding: 1.2rem;
      margin: 0 0 2rem 0;
      border-radius: 0 0 12px 12px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    .productos-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      max-width: 1000px;
      margin: auto;
    }

    .producto {
      background: rgba(255,255,255,0.95);
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
      transition: transform 0.3s ease;
    }

    .producto:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 16px rgba(0,100,0,0.3);
    }

    .producto img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 0.8rem;
    }

    .producto h3 {
      margin-bottom: 0.5rem;
      color: var(--verde-dpm);
    }

    .producto p {
      font-weight: bold;
      margin-bottom: 0.8rem;
    }

    .producto button {
      background: linear-gradient(90deg, var(--verde-dpm), var(--azul-dpm));
      color: var(--blanco);
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .producto button:hover {
      background: var(--amarillo);
      color: var(--azul-dpm);
    }

    nav {
      background: linear-gradient(90deg, var(--verde-dpm), var(--azul-dpm));
      width: 100%;
      padding: 1rem 0;
      position: fixed;
      bottom: 0;
      left: 0;
      text-align: center;
      box-shadow: 0 -4px 8px rgba(0, 0, 0, 0.2);
    }

    nav a {
      color: var(--blanco);
      margin: 0 1rem;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: var(--amarillo);
    }
  </style>
</head>
<body>
  <h1>Tienda Oficial DPM</h1>

  <div class="productos-container">
    <div class="producto">
      <img src="jugadores/polera.jpg" alt="Polera Oficial">
      <h3>Polera Oficial</h3>
      <p>$15.000</p>
      <button onclick="agregarAlCarrito('Polera Oficial', 15000)">Agregar al carrito</button>
    </div>

    <div class="producto">
      <img src="jugadores/short.webp" alt="Short Oficial">
      <h3>Short Oficial</h3>
      <p>$10.000</p>
      <button onclick="agregarAlCarrito('Short Oficial', 10000)">Agregar al carrito</button>
    </div>

    <div class="producto">
      <img src="jugadores/calcetas.webp" alt="Calcetas">
      <h3>Calcetas</h3>
      <p>$5.000</p>
      <button onclick="agregarAlCarrito('Calcetas', 5000)">Agregar al carrito</button>
    </div>

    <div class="producto">
      <img src="jugadores/yoki.jpg" alt="Gorro DPM">
      <h3>Gorro DPM</h3>
      <p>$8.000</p>
      <button onclick="agregarAlCarrito('Gorro DPM', 8000)">Agregar al carrito</button>
    </div>

    <div class="producto">
      <img src="jugadores/entrada.png" alt="Entrada Estadio">
      <h3>Entrada Estadio</h3>
      <p>$7.000</p>
      <button onclick="agregarAlCarrito('Entrada Estadio', 7000)">Agregar al carrito</button>
    </div>
  </div>

  <nav>
    <a href="login.html">Login</a>
    <a href="jugadores.html">Jugadores</a>
    <a href="posiciones.html">Tabla</a>
    <a href="novedades.html">Novedades</a>
    <a href="historia.html">Historia</a>
    <a href="tienda.html" class="active">Tienda</a>
    <a href="carrito.html">Carrito 🛒</a>
  </nav>

  <script>
    function agregarAlCarrito(nombre, precio) {
      let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
      carrito.push({ nombre, precio });
      localStorage.setItem("carrito", JSON.stringify(carrito));
      alert(nombre + " agregado al carrito 🛒");
    }
  </script>
</body>
</html>
