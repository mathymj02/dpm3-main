<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Carrito de Compras - DPM</title>
 
</head>
<body>
  <h1>Carrito de Compras</h1>

  <div class="carrito-container" id="carrito">
    <p>Tu carrito está vacío 🛒</p>
  </div>

  <div class="resumen">
    <p id="total">Total: $0</p>
    <button class="vaciar" onclick="vaciarCarrito()">Vaciar Carrito</button>
    <button class="comprar" onclick="finalizarCompra()">Finalizar Compra</button>
  </div>

  <nav>
    <a href="login.html">Login</a>
    <a href="jugadores.html">Jugadores</a>
    <a href="posiciones.html">Tabla</a>
    <a href="novedades.html">Novedades</a>
    <a href="historia.html">Historia</a>
    <a href="tienda.html">Tienda</a>
    <a href="carrito.html" class="active">Carrito 🛒</a>
  </nav>

  <script>
    function mostrarCarrito() {
      let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
      let contenedor = document.getElementById("carrito");
      let total = 0;

      if (carrito.length === 0) {
        contenedor.innerHTML = "<p>Tu carrito está vacío 🛒</p>";
      } else {
        contenedor.innerHTML = "";
        carrito.forEach((item, index) => {
          total += item.precio;
          contenedor.innerHTML += `
            <div class="producto">
              <h3>${item.nombre}</h3>
              <p>$${item.precio}</p>
              <button onclick="eliminarProducto(${index})">Eliminar</button>
            </div>
          `;
        });
      }

      document.getElementById("total").innerText = "Total: $" + total;
    }

    function eliminarProducto(index) {
      let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
      carrito.splice(index, 1);
      localStorage.setItem("carrito", JSON.stringify(carrito));
      mostrarCarrito();
    }

    function vaciarCarrito() {
      localStorage.removeItem("carrito");
      mostrarCarrito();
    }

    function finalizarCompra() {
      let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
      if (carrito.length === 0) {
        alert("Tu carrito está vacío ❌");
        return;
      }
      alert("✅ Compra realizada con éxito. ¡Gracias por apoyar al DPM!");
      localStorage.removeItem("carrito");
      mostrarCarrito();
    }

    window.onload = mostrarCarrito;
  </script>
</body>
</html>
