<!--
  ============================================================================
  Archivo: index.html
  Proyecto: DPM Pro - Club Deportes Puerto Montt
  ============================================================================
  
  ¿QUÉ HACE ESTE ARCHIVO?
  Es el punto de entrada principal (entry point) de la aplicación web. 
  Contiene la estructura básica del documento HTML donde React montará
  toda la aplicación.
  
  ¿POR QUÉ ESTA TECNOLOGÍA?
  Vite utiliza index.html como punto de entrada de la aplicación en lugar
  de archivos de JavaScript, permitiendo inyectar dependencias y el módulo
  principal directamente mediante la etiqueta <script type="module">.
  
  DECISIONES DE DISEÑO:
  - <div id="root"></div>: Es el contenedor raíz donde ReactDOM inyectará
    los componentes de React de manera dinámica.
  - viewport: Configurado para garantizar un diseño responsivo en 
    dispositivos móviles.
  ============================================================================
-->
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Club Deportes Puerto Montt (DPM)</title>
  </head>
  <body>
    <!-- Contenedor donde se monta la app de React -->
    <div id="root"></div>
    <!-- Script principal de Vite/React -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
