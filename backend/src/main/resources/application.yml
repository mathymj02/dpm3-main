# ============================================================================
# Archivo: application.yml
# Proyecto: DPM Pro - Club Deportes Puerto Montt
# ============================================================================
# 
# ¿QUÉ HACE ESTE ARCHIVO?
# Configuración central de Spring Boot. Controla la conexión a base de datos, 
# la seguridad (JWT), el puerto del servidor web y las reglas CORS. 
# Utiliza perfiles (dev, prod) para separar entornos.
# 
# ¿POR QUÉ ESTA TECNOLOGÍA?
# YAML ofrece una sintaxis mucho más limpia y legible que el tradicional application.properties.
# Al usar documentos múltiples separados por "---", podemos tener las configuraciones de 
# desarrollo y producción en un solo archivo, evitando la dispersión de variables.
# ============================================================================

# Define el perfil activo por defecto. Si no se especifica otro perfil al lanzar la app, usará 'dev'.
spring:
  profiles:
    active: dev

---
# ============================================================================
# PERFIL DE DESARROLLO (DEV)
# Se utiliza en la máquina local de los programadores. Usa base de datos H2 en memoria.
# ============================================================================
spring:
  config:
    activate:
      on-profile: dev
  
  # Configuración de base de datos en memoria (H2) para testing rápido
  datasource:
    url: jdbc:h2:mem:dpmdb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # 'update' creará las tablas o las modificará según los modelos (@Entity)
      ddl-auto: update
    # Muestra las consultas SQL en la consola para facilitar el debug
    show-sql: true
    # Permite que data.sql se ejecute después de que Hibernate cree las tablas
    defer-datasource-initialization: true
  
  sql:
    init:
      # Siempre ejecuta data.sql al arrancar en DEV para popular la BD con datos semilla
      mode: always
      
  h2:
    console:
      # Habilita la consola web en /h2-console para ver la BD desde el navegador
      enabled: true
      path: /h2-console

# Configuración JWT para DEV
jwt:
  # Clave secreta (por defecto un string largo en dev, o inyectada por variables de entorno)
  secret: ${JWT_SECRET:8a9b8c7d6e5f4g3h2i1j0k1l2m3n4o5p6q7r8s9t0u1v2w3x4y5z6A7B8C9D0E1F}
  # Tiempo de vida del token (24 horas)
  expiration: 86400000 

server:
  port: 8080

cors:
  # Permite peticiones desde el frontend local (Vite/React)
  allowed-origins: http://localhost:5173

---
# ============================================================================
# PERFIL DE PRODUCCIÓN (PROD)
# Se utiliza en el servidor de despliegue. Usa PostgreSQL.
# ============================================================================
spring:
  config:
    activate:
      on-profile: prod
      
  datasource:
    # Estos valores DEBEN inyectarse desde el SO o Docker, nunca hardcodearlos
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    
  jpa:
    hibernate:
      ddl-auto: update
    # Apagado por rendimiento y seguridad
    show-sql: false

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

server:
  port: 8080

cors:
  # Solo permite peticiones desde el dominio oficial, fallback a https://dpm.cl
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://dpm.cl}
