# ============================================================================
# Archivo: application.yml
# Proyecto: DPM Pro - Club Deportes Puerto Montt
# ============================================================================
# Configuración global y selección de perfil activo.
# Por defecto se activa el perfil 'dev' (H2 en memoria + datos semilla locales).
# En despliegue o Docker, defina SPRING_PROFILES_ACTIVE=prod (PostgreSQL).
# ============================================================================
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: dpm-backend
